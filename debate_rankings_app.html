<body class="bg-gray-50 text-gray-800 p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-gray-900">National Debate Rankings</h1>
        
        <!-- Controls -->
        <div class="flex flex-col md:flex-row gap-4 mb-6">
            <select id="seasonFilter" class="p-3 border rounded-md shadow-sm w-full md:w-48 bg-white" onchange="filterData()">
                <option value="All">All-Time</option>
                <option value="2025-2026">2025-2026</option>
                <option value="2024-2025">2024-2025</option>
                <option value="2023-2024">2023-2024</option>
            </select>
            <input type="text" id="searchInput" placeholder="Search for a team, school, or debater..." class="p-3 border rounded-md shadow-sm flex-1" onkeyup="filterData()">
        </div>

        <!-- Table -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full text-left border-collapse">
                    <thead class="bg-gray-100 border-b">
                        <tr>
                            <th class="p-3 font-semibold text-sm text-gray-600">Season</th>
                            <th class="p-3 font-semibold text-sm text-gray-600">School</th>
                            <th class="p-3 font-semibold text-sm text-gray-600">Debaters</th>
                            <th class="p-3 font-semibold text-sm text-gray-600">Total Points</th>
                            <th class="p-3 font-semibold text-sm text-gray-600">Win Rate</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y text-sm md:text-base">
                    </tbody>
                </table>
            </div>
        </div>
        <div id="noResults" class="hidden text-center p-8 text-gray-500">No records found.</div>
    </div>

    <!-- Details Modal -->
    <div id="detailsModal" class="modal fixed inset-0 items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-4xl max-h-[90vh] overflow-y-auto p-6 relative m-4">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-500 hover:text-gray-800 text-3xl font-bold leading-none">&times;</button>
            <h2 id="modalTitle" class="text-2xl font-bold mb-1">Details</h2>
            <div id="modalSub" class="text-gray-500 mb-6 font-medium text-sm"></div>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 text-center">
                <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
                    <div class="text-3xl font-bold text-blue-700" id="modalWins">0</div>
                    <div class="text-xs font-semibold tracking-wide text-blue-500 uppercase mt-1">Prelim Wins</div>
                </div>
                <div class="bg-red-50 p-4 rounded-lg border border-red-100">
                    <div class="text-3xl font-bold text-red-700" id="modalLosses">0</div>
                    <div class="text-xs font-semibold tracking-wide text-red-500 uppercase mt-1">Prelim Losses</div>
                </div>
                <div class="bg-green-50 p-4 rounded-lg border border-green-100">
                    <div class="text-3xl font-bold text-green-700" id="modalWinPct">0%</div>
                    <div class="text-xs font-semibold tracking-wide text-green-500 uppercase mt-1">Win Rate</div>
                </div>
                <div class="bg-purple-50 p-4 rounded-lg border border-purple-100">
                    <div class="text-3xl font-bold text-purple-700" id="modalPoints">0</div>
                    <div class="text-xs font-semibold tracking-wide text-purple-500 uppercase mt-1">Total Points</div>
                </div>
            </div>

            <h3 class="text-lg font-bold mb-3 border-b pb-2 text-gray-800">Tournament History</h3>
            <div class="overflow-x-auto">
                <table class="min-w-full text-left border-collapse text-sm">

                    </thead>

                </table>
            </div>
        </div>

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            const noResults = document.getElementById('noResults');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                noResults.classList.remove('hidden');
                return;
            }
            noResults.classList.add('hidden');

            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition-colors';
                
                const d1 = row['Debater 1'] ? row['Debater 1'] : '';
                const d2 = row['Debater 2'] ? row['Debater 2'] : '';
                
                tr.innerHTML = `
                    <td class="p-3 whitespace-nowrap text-gray-500">${row.Year}</td>
                    <td class="p-3">
                        <span class="clickable" onclick="openModal('school', '${row.School.replace(/'/g, "\'") }')">${row.School}</span>
                    </td>
                    <td class="p-3">
                        <span class="clickable" onclick="openModal('debater', '${d1.replace(/'/g, "\'") }')">${d1}</span> & 
                        <span class="clickable" onclick="openModal('debater', '${d2.replace(/'/g, "\'") }')">${d2}</span>
                    </td>
                    <td class="p-3 font-semibold text-gray-700">${parseFloat(row['Points Earned']).toFixed(2)}</td>
                    <td class="p-3">
                        <div class="flex items-center">
                            <span class="mr-2 w-10">${row['Prelim Win %']}%</span>
                            <div class="w-24 bg-gray-200 rounded-full h-2">
                                <div class="bg-blue-600 h-2 rounded-full" style="width: ${row['Prelim Win %']}%"></div>
                            </div>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterData() {
            const season = document.getElementById('seasonFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();

            let filtered = summaryData;

            if (season !== 'All') {
                filtered = filtered.filter(row => row.Year === season);
            }

            if (search) {
                filtered = filtered.filter(row => 
                    (row.Team && row.Team.toLowerCase().includes(search)) ||
                    (row.School && row.School.toLowerCase().includes(search)) ||
                    (row['Debater 1'] && row['Debater 1'].toLowerCase().includes(search)) ||
                    (row['Debater 2'] && row['Debater 2'].toLowerCase().includes(search))
                );
            }

            renderTable(filtered);
        }

        function openModal(type, value) {
            if(!value) return;
            
            let filteredLogs = [];
            let title = "";
            let sub = "";

            if (type === 'school') {
                filteredLogs = tournamentLogs.filter(log => log.School === value);
                title = value;
                sub = "School Profile & History";
            } else if (type === 'debater') {
                filteredLogs = tournamentLogs.filter(log => log['Debater 1'] === value || log['Debater 2'] === value);
                title = value;
                sub = "Individual Debater History";
            }

            let totalWins = 0;
            let totalLosses = 0;
            let totalPoints = 0;

            const historyHtml = filteredLogs.sort((a,b) => b.Year.localeCompare(a.Year)).map(log => {
                totalWins += (log['Prelim Wins'] || 0);
                totalLosses += (log['Prelim Losses'] || 0);
                totalPoints += (log['Points Earned'] || 0);
                
                return `
                <tr class="hover:bg-gray-100">
                    <td class="p-2 whitespace-nowrap">${log.Year}</td>
                    <td class="p-2 text-gray-800 font-medium">${log.Tournament}</td>
                    <td class="p-2 text-gray-600">${log.Team}</td>
                    <td class="p-2">${log['Prelim Wins']} - ${log['Prelim Losses']}</td>
                    <td class="p-2 font-semibold">${parseFloat(log['Points Earned']).toFixed(2)}</td>
                </tr>
                `;
            }).join('');

            const winPct = (totalWins + totalLosses) > 0 
                ? ((totalWins / (totalWins + totalLosses)) * 100).toFixed(1) 
                : 0;

            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalSub').innerText = sub;
            document.getElementById('modalWins').innerText = totalWins;
            document.getElementById('modalLosses').innerText = totalLosses;
            document.getElementById('modalWinPct').innerText = winPct + '%';
            document.getElementById('modalPoints').innerText = totalPoints.toFixed(2);
            
            document.getElementById('modalHistory').innerHTML = historyHtml;

            document.getElementById('detailsModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('detailsModal').classList.remove('active');
        }

        filterData();
    </script>
