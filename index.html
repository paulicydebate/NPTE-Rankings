<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPTE National Rankings</title>
    <script>
        // Applied before Tailwind loads / body paints, so there's no light-mode flash.
        (function () {
            var theme;
            try { theme = localStorage.getItem('npte-theme'); } catch (e) {}
            if (!theme) {
                theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            }
            if (theme === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <style>
        .modal { display: none; background: rgba(0,0,0,0.5); }
        .modal.active { display: flex; }
        .clickable { cursor: pointer; color: #2563eb; font-weight: 600; transition: color 0.2s; }
        .clickable:hover { color: #1e40af; text-decoration: underline; }
        .dark .clickable { color: #60a5fa; }
        .dark .clickable:hover { color: #93c5fd; }
        .top4-row { background-color: #fefce8; font-weight: 600; border-left: 4px solid #eab308; }
        .dark .top4-row { background-color: #422006; border-left-color: #eab308; }
        .champion-row { background-color: #fffbeb; font-weight: 600; border-left: 4px solid #f59e0b; }
        .dark .champion-row { background-color: #451a03; border-left-color: #f59e0b; }
        .sortable { cursor: pointer; user-select: none; }
        .sortable:hover { background-color: #e5e7eb; }
        .dark .sortable:hover { background-color: #374151; }
        .trophy { cursor: help; }
    </style>

        let summaryData = [];

        function initializeData() {
            const summaryMap = {};
            tournamentLogs.forEach(log => {
                // Group by season + school + the SET of debater names (order-independent),
                // not the raw Team string - otherwise "Keene Seiersen" and "Seiersen Keene"
                // get treated as two different teams and their points get split instead
                // of combined into one ranked entry.
                const school = canonicalSchool(log.School);
                const key = log.Year + '||' + school + '||' + pairKey(log);
                if (!summaryMap[key]) {
                    summaryMap[key] = {
                        Year: log.Year,
                        Team: log.Team,
                        School: school,
                        'Debater 1': canonicalName(log['Debater 1']),
                        'Debater 2': canonicalName(log['Debater 2']),
                        logs: []
                    };
                }
                summaryMap[key].logs.push(log);
            });

            summaryData = Object.values(summaryMap).map(group => {
                group.logs.sort((a, b) => (b['Points Earned'] || 0) - (a['Points Earned'] || 0));
                
                let totalWins = 0;
                let totalLosses = 0;
                let top4Points = 0;
                let elimWins = 0;
                let elimLosses = 0;

                group.logs.forEach((log, index) => {
                    totalWins += (log['Prelim Wins'] || 0);
                    totalLosses += (log['Prelim Losses'] || 0);
                    elimWins += (log['Elim Wins'] || 0);
                    elimLosses += (log['Elim Losses'] || 0);
                    if (index < 4) {
                        top4Points += (log['Points Earned'] || 0);
                    }
                });

                const winPct = (totalWins + totalLosses) > 0
                    ? ((totalWins / (totalWins + totalLosses)) * 100).toFixed(1)
                    : 0;
                const elimWinPct = (elimWins + elimLosses) > 0
                    ? ((elimWins / (elimWins + elimLosses)) * 100).toFixed(1)
                    : 0;

                return {
                    ...group,
                    'Prelim Wins': totalWins,
                    'Prelim Losses': totalLosses,
                    'Points Earned': top4Points,
                    'Prelim Win %': parseFloat(winPct),
                    'Elim Wins': elimWins,
                    'Elim Losses': elimLosses,
                    'Elim Win %': parseFloat(elimWinPct)
                };
            });

            // Seasons are derived from the data itself (sorted newest-first) rather
            // than a hardcoded list, so ingesting a new season's tournaments is
            // enough on its own - no HTML/JS edits needed for it to show up.
            allSeasons = [...new Set(tournamentLogs.map(log => log.Year))].sort().reverse();
            allSeasons.forEach(season => {
                const seasonItems = summaryData.filter(item => item.Year === season);
                seasonItems.sort((a, b) => b['Points Earned'] - a['Points Earned']);
                seasonItems.forEach((item, index) => {
                    item.rank = index + 1;
                });
            });

            partnershipData = buildPartnershipData();
            schoolAllTimeData = buildSchoolAllTimeData();
            schoolSeasonData = buildSchoolSeasonData();
            tournamentData = buildTournamentData();
            buildTitleLookups();
        }

        // Rolls the per-team-per-season rows in summaryData up into a
        // per-partnership career total (summed across every season and
        // school that pair has ever played for/represented).
        function buildPartnershipData() {
            const map = {};
            summaryData.forEach(row => {
                const key = pairKey({ 'Debater 1': row['Debater 1'], 'Debater 2': row['Debater 2'] });
                if (!map[key]) {
                    map[key] = {
                        Team: row.Team,
                        'Debater 1': row['Debater 1'],
                        'Debater 2': row['Debater 2'],
                        schools: new Set(),
                        'Points Earned': 0,
                        'Prelim Wins': 0,
                        'Prelim Losses': 0,
                        'Elim Wins': 0,
                        'Elim Losses': 0
                    };
                }
                const entry = map[key];
                entry.schools.add(row.School);
                entry['Points Earned'] += row['Points Earned'];
                entry['Prelim Wins'] += row['Prelim Wins'];
                entry['Prelim Losses'] += row['Prelim Losses'];
                entry['Elim Wins'] += row['Elim Wins'];
                entry['Elim Losses'] += row['Elim Losses'];
            });

            const list = Object.values(map).map(entry => {
                const total = entry['Prelim Wins'] + entry['Prelim Losses'];
                const elimTotal = entry['Elim Wins'] + entry['Elim Losses'];
                return {
                    ...entry,
                    School: [...entry.schools].join(', '),
                    'Prelim Win %': total > 0 ? parseFloat(((entry['Prelim Wins'] / total) * 100).toFixed(1)) : 0,
                    'Elim Win %': elimTotal > 0 ? parseFloat(((entry['Elim Wins'] / elimTotal) * 100).toFixed(1)) : 0
                };
            });
            list.sort((a, b) => b['Points Earned'] - a['Points Earned']);
            list.forEach((item, index) => { item.rank = index + 1; });
            return list;
        }

        // Rolls summaryData up into a per-school career total across every
        // team and season that has ever represented that school.
        function buildSchoolAllTimeData() {
            const map = {};
            summaryData.forEach(row => {
                if (!map[row.School]) {
                    map[row.School] = { School: row.School, 'Points Earned': 0, 'Prelim Wins': 0, 'Prelim Losses': 0, 'Elim Wins': 0, 'Elim Losses': 0 };
                }
                const entry = map[row.School];
                entry['Points Earned'] += row['Points Earned'];
                entry['Prelim Wins'] += row['Prelim Wins'];
                entry['Prelim Losses'] += row['Prelim Losses'];
                entry['Elim Wins'] += row['Elim Wins'];
                entry['Elim Losses'] += row['Elim Losses'];
            });

            const list = Object.values(map).map(entry => {
                const total = entry['Prelim Wins'] + entry['Prelim Losses'];
                const elimTotal = entry['Elim Wins'] + entry['Elim Losses'];
                return {
                    ...entry,
                    'Prelim Win %': total > 0 ? parseFloat(((entry['Prelim Wins'] / total) * 100).toFixed(1)) : 0,
                    'Elim Win %': elimTotal > 0 ? parseFloat(((entry['Elim Wins'] / elimTotal) * 100).toFixed(1)) : 0
                };
            });
            list.sort((a, b) => b['Points Earned'] - a['Points Earned']);
            list.forEach((item, index) => { item.rank = index + 1; });
            return list;
        }

        // Rolls summaryData up into one row per school PER SEASON (every
        // team representing that school that year, combined), ranked within
        // its own season the same way the team leaderboard is.
        function buildSchoolSeasonData() {
            const map = {};
            summaryData.forEach(row => {
                const key = row.Year + '||' + row.School;
                if (!map[key]) {
                    map[key] = { Year: row.Year, School: row.School, 'Points Earned': 0, 'Prelim Wins': 0, 'Prelim Losses': 0, 'Elim Wins': 0, 'Elim Losses': 0 };
                }
                const entry = map[key];
                entry['Points Earned'] += row['Points Earned'];
                entry['Prelim Wins'] += row['Prelim Wins'];
                entry['Prelim Losses'] += row['Prelim Losses'];
                entry['Elim Wins'] += row['Elim Wins'];
                entry['Elim Losses'] += row['Elim Losses'];
            });

            const list = Object.values(map).map(entry => {
                const total = entry['Prelim Wins'] + entry['Prelim Losses'];
                const elimTotal = entry['Elim Wins'] + entry['Elim Losses'];
                return {
                    ...entry,
                    'Prelim Win %': total > 0 ? parseFloat(((entry['Prelim Wins'] / total) * 100).toFixed(1)) : 0,
                    'Elim Win %': elimTotal > 0 ? parseFloat(((entry['Elim Wins'] / elimTotal) * 100).toFixed(1)) : 0
                };
            });
            allSeasons.forEach(season => {
                const seasonItems = list.filter(item => item.Year === season);
                seasonItems.sort((a, b) => b['Points Earned'] - a['Points Earned']);
                seasonItems.forEach((item, index) => { item.rank = index + 1; });

        // everything else, but it's displayed as "Teams", never as points.
        function buildTournamentData() {
            const map = {};
            tournamentLogs.forEach(log => {
                const key = log.Year + '||' + log.Tournament;
                if (!map[key]) {
                    map[key] = { Year: log.Year, Tournament: log.Tournament, teams: [] };
                }
                map[key].teams.push(log);

            const list = Object.values(map).map(entry => ({

            allSeasons.forEach(season => {

                seasonItems.sort((a, b) => b['Points Earned'] - a['Points Earned']);
                seasonItems.forEach((item, index) => { item.rank = index + 1; });
            });
            return list;
        }

                cols = `<th class="${th}">Team</th><th class="${th}">School(s)</th>${pointsTh}${winRateTh}`;
            } else if (currentViewMode === 'schoolsAllTime') {
                cols = `<th class="${th}">School</th>${pointsTh}${winRateTh}`;
            } else if (currentViewMode === 'schoolsBySeason') {
                cols = `<th class="${th}">Season</th><th class="${th}">School</th>${pointsTh}${winRateTh}`;
            } else { // tournaments
                cols = `<th class="${th}">Season</th><th class="${th}">Tournament</th>${pointsTh}<th class="${th}">Champion(s)</th>`;
            }

            document.getElementById('tableHeaderRow').innerHTML = rankTh + cols;
            updateSortIcons();
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            const noResults = document.getElementById('noResults');
            const season = document.getElementById('seasonFilter').value;
            tbody.innerHTML = '';

            if (data.length === 0) {
                noResults.classList.remove('hidden');
                return;
            }
            noResults.classList.add('hidden');

            const isAllTime = (currentViewMode === 'partnerships' || currentViewMode === 'schoolsAllTime');
            const showRank = isAllTime || season !== 'All';

            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors';

                const esc = (s) => (s || '').replace(/'/g, "\\'");
                const pointsValue = parseFloat(row['Points Earned']).toFixed(2);
                const rankHtml = `<td class="p-3 font-bold text-gray-700 dark:text-gray-200" style="${showRank ? '' : 'display:none;'}">#${row.rank || '-'}</td>`;
                const winRateHtml = `
                    <td class="p-3">
                        <div class="flex items-center">
                            <span class="mr-4 w-12 inline-block text-right text-gray-600 dark:text-gray-300">${row['Prelim Win %']}%</span>
                            <div class="w-24 bg-gray-200 dark:bg-gray-700 rounded-full h-2">
                                <div class="bg-blue-600 dark:bg-blue-500 h-2 rounded-full" style="width: ${row['Prelim Win %']}%"></div>
                            </div>
                        </div>
                    </td>`;

                let cols;
                if (currentViewMode === 'teams') {
                    const d1 = row['Debater 1'] || '';
                    const d2 = row['Debater 2'] || '';
                    const teamDisplay = (d2 ? `${d1} & ${d2}` : d1) + trophySpan(getSeasonTitles(row.Year, d1, d2));
                    cols = `
                        <td class="p-3 whitespace-nowrap text-gray-500 dark:text-gray-400">${row.Year}</td>
                        <td class="p-3"><span class="clickable text-blue-700" onclick="openModal('team', '${esc(row.Team)}')">${teamDisplay}</span></td>
                        <td class="p-3"><span class="clickable" onclick="openModal('school', '${esc(row.School)}')">${row.School}</span></td>
                        <td class="p-3 font-semibold text-gray-700 dark:text-gray-200"><span class="clickable text-purple-700" onclick="openModal('seasonPoints', '${esc(row.Team)}', '${row.Year}')">${pointsValue}</span></td>
                        ${winRateHtml}
                    `;
                } else if (currentViewMode === 'partnerships') {
                    const d1 = row['Debater 1'] || '';
                    const d2 = row['Debater 2'] || '';
                    const teamDisplay = (d2 ? `${d1} & ${d2}` : d1) + trophySpan(getPairTitles(d1, d2));
                    cols = `
                        <td class="p-3"><span class="clickable text-blue-700" onclick="openModal('team', '${esc(row.Team)}')">${teamDisplay}</span></td>
                        <td class="p-3 text-gray-700 dark:text-gray-300">${row.School}</td>
                        <td class="p-3 font-semibold text-gray-700 dark:text-gray-200"><span class="clickable text-purple-700" onclick="openModal('team', '${esc(row.Team)}')">${pointsValue}</span></td>
                        ${winRateHtml}
                    `;
                } else if (currentViewMode === 'schoolsAllTime') {
                    cols = `
                        <td class="p-3"><span class="clickable" onclick="openModal('school', '${esc(row.School)}')">${row.School}</span></td>
                        <td class="p-3 font-semibold text-gray-700 dark:text-gray-200"><span class="clickable text-purple-700" onclick="openModal('school', '${esc(row.School)}')">${pointsValue}</span></td>
                        ${winRateHtml}
                    `;
                } else if (currentViewMode === 'schoolsBySeason') {
                    cols = `
                        <td class="p-3 whitespace-nowrap text-gray-500 dark:text-gray-400">${row.Year}</td>
                        <td class="p-3"><span class="clickable" onclick="openModal('school', '${esc(row.School)}')">${row.School}</span></td>
                        <td class="p-3 font-semibold text-gray-700 dark:text-gray-200"><span class="clickable text-purple-700" onclick="openModal('schoolSeason', '${esc(row.School)}', '${row.Year}')">${pointsValue}</span></td>
                        ${winRateHtml}
                    `;
                } else { // tournaments
                    const champions = row.teams.filter(t => (t['Elim Wins'] || 0) > 0 && (t['Elim Losses'] || 0) === 0);
                    const championHtml = champions.length
                        ? champions.map(c => {
                            const label = (c['Debater 2'] ? `${c['Debater 1']} & ${c['Debater 2']}` : c['Debater 1']) + trophySpan(getPairTitles(c['Debater 1'], c['Debater 2']));
                            return `<span class="clickable" onclick="openModal('team', '${esc(c.Team)}')">${label}</span>`;
                        }).join(', ')
                        : '<span class="text-gray-400 dark:text-gray-500">—</span>';
                    cols = `
                        <td class="p-3 whitespace-nowrap text-gray-500 dark:text-gray-400">${row.Year}</td>
                        <td class="p-3"><span class="clickable text-blue-700" onclick="openModal('tournament', '${esc(row.Tournament)}', '${row.Year}')">${row.Tournament}</span></td>
                        <td class="p-3 font-semibold text-gray-700 dark:text-gray-200">${row.teams.length}</td>
                        <td class="p-3">${championHtml}</td>
                    `;
                }

                tr.innerHTML = rankHtml + cols;
                tbody.appendChild(tr);
            });
        }

        function filterData() {
            const season = document.getElementById('seasonFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();

            let filtered;
            if (currentViewMode === 'teams') {
                filtered = season !== 'All' ? summaryData.filter(row => row.Year === season) : [...summaryData];
            } else if (currentViewMode === 'partnerships') {
                filtered = [...partnershipData];
            } else if (currentViewMode === 'schoolsAllTime') {
                filtered = [...schoolAllTimeData];
            } else if (currentViewMode === 'schoolsBySeason') {
                filtered = season !== 'All' ? schoolSeasonData.filter(row => row.Year === season) : [...schoolSeasonData];
            } else { // tournaments
                filtered = season !== 'All' ? tournamentData.filter(row => row.Year === season) : [...tournamentData];
            }

            if (search) {
                filtered = filtered.filter(row =>
                    (row.Team && row.Team.toLowerCase().includes(search)) ||
                    (row.School && row.School.toLowerCase().includes(search)) ||
                    (row['Debater 1'] && row['Debater 1'].toLowerCase().includes(search)) ||
                    (row['Debater 2'] && row['Debater 2'].toLowerCase().includes(search)) ||
                    (row.Tournament && row.Tournament.toLowerCase().includes(search))
                );
            }

            filtered.sort((a, b) => {
                let valA, valB;
                if (currentSortColumn === 'points') {
                    valA = a['Points Earned'];
                    valB = b['Points Earned'];
                } else if (currentSortColumn === 'winrate') {
                    valA = a['Prelim Win %'];
                    valB = b['Prelim Win %'];
                }
                
                if (currentSortDirection === 'desc') {
                    return valB - valA;
                } else {
                    return valA - valB;
                }
            });

            renderTable(filtered);
        }

        // Normalizes a debater name for matching: trims whitespace and lowercases.
        // This is what lets us recognize "Brenna Seiersen" as the same person
        // whether she's listed at Diablo Valley College or at Berkeley.
        // School aliases are deliberately kept separate from tournamentLogs.
        // A future full data re-ingest can replace tournamentLogs without losing
        // the school merge rules below. canonicalSchool() applies that persistent
        // school identity layer at runtime.
        // Canonicalize school/program labels so aliases are treated as one school.
        const SCHOOL_ALIASES = {
            'Rice': 'Rice University',
            'Rice University': 'Rice University',
            'Whitman': 'Whitman College',
            'Whitman College': 'Whitman College',
            'William Jewell': 'William Jewell College',
            'William Jewell College': 'William Jewell College',
            'WJC': 'William Jewell College',
            'Jewell': 'William Jewell College',
            'McKendree': 'McKendree University',
            'McKendree University': 'McKendree University',
            'Mercer': 'Mercer University',
            'Mercer University': 'Mercer University',
            'Tulane': 'Tulane University',
            'Tulane University': 'Tulane University',
            'Utah': 'University of Utah',
            'University of Utah': 'University of Utah',
            'Oregon': 'University of Oregon',
            'University of Oregon': 'University of Oregon',
            'SDSU': 'San Diego State University',
            'San Diego State University': 'San Diego State University',
            'App State University': 'Appalachian State University',
            'Appalachian State University': 'Appalachian State University',
            'KCKCC': 'Kansas City Kansas Community College',
            'Kansas City Kansas CC': 'Kansas City Kansas Community College',
            'Solano': 'Solano Community College',
            'Solano Community College': 'Solano Community College',
            'UT Tyler': 'University of Texas at Tyler',
            'University of Texas at Tyler': 'University of Texas at Tyler',
            "Saint Mary's College": "Saint Mary's College",
            "St. Mary's College": "Saint Mary's College",
            "Saint Mary's": "Saint Mary's College",
            "Saint Mary's College SMC": "Saint Mary's College",
            "Saint Mary's College of California": "Saint Mary's College",
            "Saint Mary's Independent": "Saint Mary's College",
            'City College San Francisco': 'City College of San Francisco',
            'City College of San Francisco': 'City College of San Francisco',
            'Diabo Valley College': 'Diablo Valley College',
            'Diablo Valley College': 'Diablo Valley College',
            'Debate at Davis': 'UC Davis',
            'Debate at UC Davis': 'UC Davis',
            'Notre Dame Debate Team': 'University of Notre Dame',
            'University of Notre Dame': 'University of Notre Dame',
            'Illini Forensics': 'University of Illinois Urbana-Champaign',
            'University of Illinois at Urbana': 'University of Illinois Urbana-Champaign',
            'Parliamentary Debate at Berkeley': 'UC Berkeley',
            'UC Berkeley': 'UC Berkeley',
            'SFSU-Hybrid': 'San Francisco State University',
            'San Francisco State University': 'San Francisco State University',
            'Urban Texas': 'Urban Texas Forensics',
            'Urban Texas Forensics': 'Urban Texas Forensics'
        };

        function canonicalSchool(name) {
            const cleaned = (name || '').toString().trim();
            return SCHOOL_ALIASES[cleaned] || cleaned;
        }

        // Debater name aliases: the same idea as SCHOOL_ALIASES above, but for
        // individual debaters whose name was misspelled in some tournament
        // entries. Without this, a typo like "Maximum Renteria" instead of
        // "Maximus Renteria" creates a second, separate team record that never
        // merges with the debater's real history.
        const NAME_ALIASES = {
            'maximum renteria': 'Maximus Renteria',
            'max renteria': 'Maximus Renteria',
            'kyle sandefer': 'Kyle Sanderfer',
            'joshua smith': 'Josh Smith',
            'ilse spiropoulous': 'Ilse Spiropoulos',
            'ilsa spiropoulous': 'Ilse Spiropoulos',
            'ariun surva': 'Arjun Surya'
        };

        function canonicalName(name) {
            const cleaned = (name || '').toString().trim();
            return NAME_ALIASES[cleaned.toLowerCase()] || cleaned;
        }

        function normName(n) {
            return canonicalName(n).toLowerCase();
        }

        // A pair key is order-independent and school-independent: it identifies
        // a TEAM (the two debaters together) regardless of which program they
        // were registered under for a given tournament. Two logs with the same
        // pair key are the same team even if their School/Team strings differ.
        function pairKey(log) {
            const names = [normName(log['Debater 1']), normName(log['Debater 2'])]
                .filter(n => n)
                .sort();
            return names.join('||');
        }

        // National championship history - manually curated, not derived from
        // tournamentLogs (nationals results aren't part of the regular-season
        // ingest). Names here must match the canonical spelling used
        // elsewhere (post NAME_ALIASES) so they line up with a pair's real
        // record via the same pairKey() everything else uses.
        const NATIONAL_TITLES = [
            { year: '2021-2022', d1: 'Alex Li', d2: 'Gabe Graville', titles: ['NPTE'] },
            { year: '2021-2022', d1: 'Maximus Renteria', d2: 'Jacob Tate', titles: ['NPDA'] },
            { year: '2022-2023', d1: 'Brenna Seiersen', d2: 'Tristan Keene', titles: ['NPTE', 'NPDA'] },
            { year: '2022-2023', d1: 'Holden Carrillo', d2: 'Arjun Banerjee', titles: ['NPTE'] },
            { year: '2023-2024', d1: 'Brenna Seiersen', d2: 'Tristan Keene', titles: ['NPTE', 'NPDA'] },
            { year: '2024-2025', d1: 'Alexa Grechishkin', d2: 'Isabel Mathy', titles: ['NPDA'] },
            { year: '2024-2025', d1: 'Trent Dixon', d2: 'Patrick Terry', titles: ['NPTE'] },
            { year: '2025-2026', d1: 'Adrian Lossada', d2: 'Jasper Pacheco', titles: ['NPDA'] },
            { year: '2025-2026', d1: 'Tejas Prabhune', d2: 'Timothy Zhu', titles: ['NPTE'] }
        ];

        // pairKey -> [{year, titles}], and canonical debater name -> [{year, titles, partner}]
        let pairTitleMap = {};
        let debaterTitleMap = {};

        function buildTitleLookups() {
            pairTitleMap = {};
            debaterTitleMap = {};
            NATIONAL_TITLES.forEach(t => {
                const pk = pairKey({ 'Debater 1': t.d1, 'Debater 2': t.d2 });
                (pairTitleMap[pk] = pairTitleMap[pk] || []).push({ year: t.year, titles: t.titles });

                [[t.d1, t.d2], [t.d2, t.d1]].forEach(([self, partner]) => {
                    const name = canonicalName(self);
                    (debaterTitleMap[name] = debaterTitleMap[name] || []).push({
                        year: t.year, titles: t.titles, partner: canonicalName(partner)
                    });
                });
            });
        }

        function getPairTitles(d1, d2) {
            return pairTitleMap[pairKey({ 'Debater 1': d1, 'Debater 2': d2 })] || [];
        }

        function getSeasonTitles(year, d1, d2) {
            return getPairTitles(d1, d2).filter(t => t.year === year);
        }

        function getDebaterTitles(name) {
            return debaterTitleMap[canonicalName(name)] || [];
        }

        function titleTooltip(entries) {
            return entries.map(t => `${t.year}: ${t.titles.join(' & ')} National Champion${t.titles.length > 1 ? 's' : ''}`).join('\n');
        }

        function trophySpan(entries) {
            if (!entries || entries.length === 0) return '';
            return ` <span class="trophy" title="${titleTooltip(entries).replace(/"/g, '&quot;')}">🏆</span>`;
        }

        function titleBannerHtml(entries, { withPartner } = {}) {
            if (!entries || entries.length === 0) return '';
            const parts = entries.map(t => {
                const label = `${t.year} ${t.titles.join(' & ')} National Champion${t.titles.length > 1 ? 's' : ''}`;
                return withPartner && t.partner ? `${label} (with ${t.partner})` : label;
            });
            return `<div class="mt-1 text-amber-600 dark:text-amber-400 font-semibold">🏆 ${parts.join(' &middot; ')}</div>`;
        }

        function openModal(type, value, year = null) {
            if(!value) return;
            
            let filteredLogs = [];
            let title = "";
            let sub = "";
            let pointsLabel = "Total Points";

            if (type === 'school') {
                filteredLogs = tournamentLogs.filter(log => canonicalSchool(log.School) === canonicalSchool(value));
                title = value;
                sub = "School Profile & History";
            } else if (type === 'debater') {
                const target = canonicalName(value);
                filteredLogs = tournamentLogs.filter(log => canonicalName(log['Debater 1']) === target || canonicalName(log['Debater 2']) === target);
                title = value;
                sub = "Individual Debater History" + titleBannerHtml(getDebaterTitles(target), { withPartner: true });
            } else if (type === 'team') {
                // First find the specific school-registration the user clicked,
                // then pull ITS debater pair, then match that pair across the
                // ENTIRE dataset regardless of School. This is what combines a
                // team's history across programs (e.g. a pair that debated for
                // two different schools in different seasons).
                const clickedLogs = tournamentLogs.filter(log => log.Team === value);
                const key = clickedLogs.length > 0 ? pairKey(clickedLogs[0]) : null;
                filteredLogs = key
                    ? tournamentLogs.filter(log => pairKey(log) === key)
                    : clickedLogs;
                title = "Team History";
                
                if (filteredLogs.length > 0) {
                    const d1 = canonicalName(filteredLogs[0]['Debater 1'] || '');
                    const d2 = canonicalName(filteredLogs[0]['Debater 2'] || '');
                    
                    let links = [];
                    if(d1) links.push(`<span class="clickable" onclick="openModal('debater', '${d1.replace(/'/g, "\\'") }')">${d1}</span>`);
                    if(d2) links.push(`<span class="clickable" onclick="openModal('debater', '${d2.replace(/'/g, "\\'") }')">${d2}</span>`);
                    
                    sub = "Debaters: " + links.join(' & ');

                    // Note when the pair has represented more than one school,
                    // since the rows below will mix schools together.
                    const schools = [...new Set(filteredLogs.map(l => canonicalSchool(l.School)))];
                    if (schools.length > 1) {
                        sub += ` <span class="text-gray-400 font-normal">(combined across ${schools.join(', ')})</span>`;
                    }
                    sub += titleBannerHtml(getPairTitles(d1, d2));
                }
            } else if (type === 'seasonPoints') {
                filteredLogs = tournamentLogs.filter(log => log.Team === value && log.Year === year);
                title = "Season Points Breakdown (" + year + ")";
                
                if (filteredLogs.length > 0) {
                    const d1 = canonicalName(filteredLogs[0]['Debater 1'] || '');
                    const d2 = canonicalName(filteredLogs[0]['Debater 2'] || '');
                    let links = [];
                    if(d1) links.push(`<span class="clickable" onclick="openModal('debater', '${d1.replace(/'/g, "\\'") }')">${d1}</span>`);
                    if(d2) links.push(`<span class="clickable" onclick="openModal('debater', '${d2.replace(/'/g, "\\'") }')">${d2}</span>`);
                    sub = links.join(' & ') + ` — Top 4 tournaments are highlighted in yellow.`;
                    sub += titleBannerHtml(getSeasonTitles(year, d1, d2));
                }
                pointsLabel = "Top 4 Points";
            } else if (type === 'schoolSeason') {
                filteredLogs = tournamentLogs.filter(log => canonicalSchool(log.School) === canonicalSchool(value) && log.Year === year);
                title = value;
                sub = `School Profile — ${year} Season`;
            } else if (type === 'tournament') {
                filteredLogs = tournamentLogs.filter(log => log.Tournament === value && log.Year === year);
                title = value;
                sub = `${year} Season &middot; ${filteredLogs.length} team${filteredLogs.length === 1 ? '' : 's'}`;
            }

            if (type === 'seasonPoints') {
                filteredLogs.sort((a,b) => (b['Points Earned'] || 0) - (a['Points Earned'] || 0));
            } else {
                filteredLogs.sort((a,b) => {
                    if (a.Year !== b.Year) return b.Year.localeCompare(a.Year);
                    return (b['Points Earned'] || 0) - (a['Points Earned'] || 0);
                });
            }

            let totalWins = 0;
            let totalLosses = 0;
            let displayedPoints = 0;
            let elimWins = 0;
            let elimLosses = 0;

            const historyHtml = filteredLogs.map((log, index) => {
                totalWins += (log['Prelim Wins'] || 0);
                totalLosses += (log['Prelim Losses'] || 0);
                elimWins += (log['Elim Wins'] || 0);
                elimLosses += (log['Elim Losses'] || 0);

                let isTop4 = (type === 'seasonPoints' && index < 4);
                let isChampion = (type === 'tournament' && (log['Elim Wins'] || 0) > 0 && (log['Elim Losses'] || 0) === 0);

                if (type === 'seasonPoints') {
                    if (isTop4) displayedPoints += (log['Points Earned'] || 0);
                } else {
                    displayedPoints += (log['Points Earned'] || 0);
                }

                let rowClass = isTop4 ? "top4-row" : isChampion ? "champion-row" : "hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors";
                const elimRecord = ((log['Elim Wins'] || 0) + (log['Elim Losses'] || 0)) > 0
                    ? `${log['Elim Wins'] || 0} - ${log['Elim Losses'] || 0}`
                    : '—';

                return `
                <tr class="${rowClass}">
                    <td class="p-2 whitespace-nowrap pl-4 border-l border-transparent">${log.Year}</td>
                    <td class="p-2 text-gray-800 dark:text-gray-100 font-medium">${log.Tournament}</td>
                    <td class="p-2 text-gray-600 dark:text-gray-400">${isChampion ? '🏆 ' : ''}${log.Team}</td>
                    <td class="p-2">${log['Prelim Wins']} - ${log['Prelim Losses']}</td>
                    <td class="p-2 text-gray-600 dark:text-gray-400">${elimRecord}</td>
                    <td class="p-2 font-semibold text-right pr-4">${parseFloat(log['Points Earned']).toFixed(2)}</td>
                </tr>
                `;
            }).join('');

            const winPct = (totalWins + totalLosses) > 0
                ? ((totalWins / (totalWins + totalLosses)) * 100).toFixed(1)
                : 0;
            const elimWinPct = (elimWins + elimLosses) > 0
                ? ((elimWins / (elimWins + elimLosses)) * 100).toFixed(1)
                : 0;

            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalSub').innerHTML = sub;
            document.getElementById('modalWins').innerText = totalWins;
            document.getElementById('modalLosses').innerText = totalLosses;
            document.getElementById('modalWinPct').innerText = winPct + '%';
            document.getElementById('modalPoints').innerText = displayedPoints.toFixed(2);
            document.getElementById('modalPointsLabel').innerText = pointsLabel;
            document.getElementById('modalElimWins').innerText = elimWins;
            document.getElementById('modalElimLosses').innerText = elimLosses;
            document.getElementById('modalElimWinPct').innerText = elimWinPct + '%';

            document.getElementById('modalHistory').innerHTML = historyHtml;

            document.getElementById('detailsModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('detailsModal').classList.remove('active');
        }

        function updateThemeIcon() {
            const btn = document.getElementById('themeToggle');
            if (btn) btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            try { localStorage.setItem('npte-theme', isDark ? 'dark' : 'light'); } catch (e) {}
            updateThemeIcon();
        }

        initializeData();
        populateSeasonDropdown();
        document.getElementById('seasonFilter').value = allSeasons[0] || 'All';
        updateThemeIcon();
        onSeasonChange();
    </script>
</body>
</html>
